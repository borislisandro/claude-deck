# claude-deck kitty config. Generated by claude-deck; edits are overwritten when the
# deck starts. Put your own tweaks in ~/.config/claude-deck/kitty.conf instead.

# Your normal kitty look and keys first, so the deck feels like your terminal.
{{USER_INCLUDE}}

allow_remote_control socket-only
confirm_os_window_close 0
enabled_layouts splits,tall,grid,stack
watcher {{DIR}}/watcher.py

# Tab titles carry each session's status dot, number, project and wait time.
tab_bar_min_tabs 1
tab_title_template "{custom}"
active_tab_font_style bold
# A neutral active tab, so the red/yellow/green status dots stay readable on it.
active_tab_background #3a2c2f
active_tab_foreground #ffffff

# Shells opened from the deck must not inherit the deck's config directory.
env KITTY_CONFIG_DIRECTORY
env CLAUDE_DECK_SID

# --- Sessions ---------------------------------------------------------------
map ctrl+shift+n          launch --type=tab --cwd=~ {{EXE}} pick --exec
map ctrl+shift+enter      launch --location=vsplit --cwd=current {{EXE}} run-session
map ctrl+shift+minus      launch --location=hsplit --cwd=current {{EXE}} run-session
map ctrl+shift+alt+enter  launch --location=vsplit --cwd=~ {{EXE}} pick --exec
map ctrl+shift+w          launch --type=background {{EXE}} close-window @active-kitty-window-id
map f7                    launch --type=background {{EXE}} close-window @active-kitty-window-id
map ctrl+shift+r          launch --type=background {{EXE}} restore

# --- Getting around ---------------------------------------------------------
map ctrl+shift+space      launch --type=background {{EXE}} next-waiting
map ctrl+shift+o          launch --type=overlay {{EXE}} overview
map ctrl+1                launch --type=background {{EXE}} goto 1
map ctrl+2                launch --type=background {{EXE}} goto 2
map ctrl+3                launch --type=background {{EXE}} goto 3
map ctrl+4                launch --type=background {{EXE}} goto 4
map ctrl+5                launch --type=background {{EXE}} goto 5
map ctrl+6                launch --type=background {{EXE}} goto 6
map ctrl+7                launch --type=background {{EXE}} goto 7
map ctrl+8                launch --type=background {{EXE}} goto 8
map ctrl+9                launch --type=background {{EXE}} goto 9

map alt+left              neighboring_window left
map alt+right             neighboring_window right
map alt+up                neighboring_window up
map alt+down              neighboring_window down
map alt+h                 neighboring_window left
map alt+l                 neighboring_window right
map alt+k                 neighboring_window up
map alt+j                 neighboring_window down

# --- Arranging --------------------------------------------------------------
map alt+shift+left        move_window left
map alt+shift+right       move_window right
map alt+shift+up          move_window up
map alt+shift+down        move_window down
map ctrl+alt+shift+left   resize_window narrower 3
map ctrl+alt+shift+right  resize_window wider 3
map ctrl+alt+shift+up     resize_window taller 3
map ctrl+alt+shift+down   resize_window shorter 3
map ctrl+shift+l          next_layout
map ctrl+shift+z          toggle_layout stack
map ctrl+shift+g          launch --type=background {{EXE}} tile
map ctrl+shift+u          launch --type=background {{EXE}} untile

{{LOCAL_INCLUDE}}

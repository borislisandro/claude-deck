name: CI
on:
  push:
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo clippy --locked -- -D warnings
  kitty-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile src/assets/kitty/*.py
      - run: python3 -c "import json; json.load(open('plasmoid/package/metadata.json'))"
